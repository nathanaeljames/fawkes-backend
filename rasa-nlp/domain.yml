version: "3.1"

intents:
  - user_greet
  - user_goodbye
  - user_ask_time
  - user_ask_name
  - nlu_fallback
  - affirm
  - deny
  - provide_first_name
  - provide_full_name
  - spell_name
  - trigger_enrollment
  - correct_spelling
  - start_spelling
  - system_enrollment_complete_success
  - system_enrollment_complete_aborted
  - request_voice_cloning


entities:
  - firstname
  - surname

slots:
  # ECAPA speaker tracking: name, firstname, surname
  ecapa_name:
    type: text
    initial_value: null
    influence_conversation: false
    mappings:
      - type: custom
  ecapa_uid:
    type: text
    initial_value: null
    influence_conversation: false
    mappings:
      - type: custom
  ecapa_firstname:
    type: text
    initial_value: null
    influence_conversation: false
    mappings:
      - type: custom
  ecapa_surname:
    type: text
    initial_value: null
    influence_conversation: false
    mappings:
      - type: custom
  # IMPRINT speaker tracking: name, uid, firstname, surname, firstname spelled, surname spelled
  imprint_name:
    type: text
    mappings:
      - type: custom
  imprint_uid:
    type: text
    initial_value: null
    influence_conversation: false
    mappings:
      - type: custom
  imprint_firstname:
    type: text
    mappings:
      - type: from_entity
        entity: firstname
        intent: [provide_full_name, provide_first_name]
      - type: from_text
        conditions:
          - active_loop: name_collection_form
            requested_slot: imprint_firstname
  imprint_surname:
    type: text
    mappings:
      - type: from_entity
        entity: surname
        intent: provide_full_name
      - type: from_text
        conditions:
          - active_loop: name_collection_form
            requested_slot: imprint_surname
  imprint_firstname_spelled:
    type: text
    initial_value: null
    mappings:
      - type: custom
  imprint_surname_spelled:
    type: text
    initial_value: null
    mappings:
      - type: custom
  # IMPRINT workflow - Name collection form/ imprint variables: is name complete, spelling stage, enrollment active, enrollment muted
  name_complete:
    type: bool
    initial_value: false
    influence_conversation: true
    mappings:
      - type: custom
  spelling_stage: # Tracks: null, "confirming_both", "spelling_first", "spelling_last", "complete"
    type: text
    initial_value: null
    influence_conversation: true
    mappings:
      - type: custom
  enrollment_active:
    type: bool
    initial_value: false
    influence_conversation: false
    mappings:
      - type: custom
  enrollment_muted:
    type: bool
    initial_value: false
    influence_conversation: false
    mappings:
      - type: custom
  # VOICECLONE speaker tracking
  voiceclone_lazyname:
    type: text
    initial_value: null
    mappings:
      - type: custom
  voiceclone_candidate:
    type: text
    initial_value: null
    influence_conversation: false
    mappings:
      - type: custom
  voiceclone_verified:
    type: text
    initial_value: null
    influence_conversation: false
    mappings:
      - type: custom
  # VOICECLONE name selection
  voiceclone_confidence:
    type: float
    initial_value: null
    influence_conversation: false
    mappings:
      - type: custom
  voiceclone_retry_count:
    type: any
    initial_value: 0
    influence_conversation: false
    mappings:
      - type: custom
  voiceclone_active:
    type: bool
    initial_value: false
    influence_conversation: true
    mappings:
      - type: custom
  # VOICECLONE passage selection
  available_passage_sources:
    type: list
    initial_value: []
    influence_conversation: false
    mappings:
      - type: custom
  selected_passage_source:
    type: text
    initial_value: null
    mappings:
      - type: from_text
        intent: select_passage_source
  selected_quote:
    type: text
    initial_value: null
    influence_conversation: false
    mappings:
      - type: custom
  # Basic action variables: server name, part of day, time of day
  server_name:
    type: text
    initial_value: "Fawkes"
    influence_conversation: false
    mappings:
      - type: custom
  part_of_day:
    type: text
    initial_value: "day"
    influence_conversation: false
    mappings:
      - type: custom
  time_of_day:
    type: text
    initial_value: null
    influence_conversation: false
    mappings:
      - type: custom

forms:
  name_collection_form:
    required_slots:
      - imprint_firstname
      - imprint_surname

responses:
  utter_greet:
  - text: "Hello! How can I help you?"

  utter_goodbye:
  - text: "Goodbye! Have a great day!"

  utter_tell_name:
  - text: "My name is {server_name}. What is your name?" # Fallback response (firstname is null)
    condition:
    - type: slot
      name: ecapa_firstname
      value: null # FIX 2: Swap order, check if slot IS null
  - text: "My name is {server_name}. How can I help you {ecapa_firstname}?" # Personalized response (ecapa_firstname is NOT null)

  utter_greet_personalized:
  - text: "Good {part_of_day}! How can I help you?" # Fallback response (ecapa_firstname is null)
    condition:
    - type: slot
      name: ecapa_firstname
      value: null # FIX 2: Swap order, check if slot IS null
  - text: "Good {part_of_day} {ecapa_firstname}! How can I help you?" # Personalized response (ecapa_firstname is NOT null)

  utter_ask_familar:
  - text: "I don't recognize your voice. Have I met you before?"
  - text: "Hello there! Who am I speaking to?"
  - text: "Hello! I don't think we've met. What's your name?"

  utter_ask_full_name:
  - text: "Can I get your first and last name for record's sake?"

  utter_ask_imprint_firstname:
    - text: "What is your first name?"
  
  utter_ask_imprint_surname:
    - text: "And what is your last name?"
  
  utter_ask_confirm_full_name:
    - text: "First name {imprint_firstname}, last name {imprint_surname}. Did I get that right?"
  
  utter_ask_confirm_spelling:
    - text: "Did I spell everything correctly?"
  
  utter_ask_spell_firstname:
    - text: "Can you spell your first name letter-by-letter?"
  
  utter_ask_spell_surname:
    - text: "Can you spell your last name letter-by-letter?"
  
  utter_confirm_firstname_spelling:
    - text: "{imprint_firstname}, spelled {imprint_firstname_spelled}. Did I get that right?"
  
  utter_confirm_surname_spelling:
    - text: "{imprint_surname}, spelled {imprint_surname_spelled}. Did I get that right?"
  
  utter_great:
    - text: "Great!"
  
  utter_apology_retry:
    - text: "My apologies."

  utter_very_well:
  - text: "Very well."

  utter_tell_time:
  - text: "The time is {time_of_day}"

  utter_pleasure_meet_again:
  - text: "It's a pleasure to meet you again {ecapa_firstname}."
    condition:
    - type: slot
      name: imprint_firstname
      value: null
  - text: "It's a pleasure to meet you again {imprint_firstname}."

  utter_pleasure_meet:
  - text: "It's a pleasure to meet you {imprint_firstname}."

  utter_ask_recite_prompt:
  - text: "In order to better serve you, can I ask you to recite a prompt for me?"

  utter_read_prompt:
  - text: "Excellent. Can you please read aloud the following prompt:"

  utter_no_record:
  - text: "I don't seem to have a record for you."

  utter_weak_imprint:
  - text: "I don't seem to have enough voice data to easily recognize your voice."

  utter_thinking_about:
  - text: "I'm thinking about your mother." 
    condition:
    - type: slot
      name: ecapa_firstname
      value: null
  - text: "I'm thinking about your mother {ecapa_firstname}."

  utter_default:
  - text: "I'm sorry, I didn't understand that. Could you please rephrase?"
  - text: "I don't understand. Can you try saying that differently?"

  utter_ask_experiment_voice_cloning:
    - text: "Would you like to experiment with voice cloning?"
  
  utter_ask_whose_voice:
    - text: "Whose voice would you like to clone?"

  utter_confirm_speaker_match:
    - text: "Did you mean {voiceclone_candidate}?"
  
  utter_voiceclone_proceed:
    - text: "Proceeding to voice clone with {voiceclone_candidate}"

  utter_ask_voiceclone_retry:
    - text: "I'm sorry I didn't catch that. Can you say their first and last name?"
  
  utter_voiceclone_abort:
    - text: "I'm sorry I don't seem to have any speaker on file with the name {voiceclone_lazyname}"
  
  utter_speaker_not_found:
    - text: "I'm sorry, I don't seem to know that speaker's voice."

  utter_ask_passage_source:
    - text: "Would you like to hear a passage from {available_passage_sources}?"
  
  utter_ask_another_quote:
    - text: "Would you like to hear another quote?"
  
  utter_voice_cloning_complete:
    - text: "Voice cloning experiment complete."

actions:
  - action_log_slots
  - action_set_time_of_day
  - action_do_nothing
  - action_set_part_of_day
  - action_query_userbase
  - action_start_enrollment_recording
  - action_trigger_enrollment
  - action_mute_enrollment
  - action_set_name_slots
  - action_process_spelling
  - action_confirm_full_name
  - action_handle_spelling_confirmation
  - validate_name_collection_form
  - action_handle_name_input
  - action_handle_enrollment_routing
  - action_reset_enrollment
  - action_start_voice_cloning
  - action_reset_voice_cloning
  - action_confirm_speaker_match
  - action_reject_speaker_match
  - action_set_voiceclone_lazyname
  - action_fetch_passage_sources
  - action_select_and_synthesize_passage

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
