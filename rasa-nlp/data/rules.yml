version: "3.1"

rules:

- rule: Say hello when the user says hello
  steps:
  - intent: user_greet
  - action: action_set_name_slots
  - action: action_set_part_of_day
  - action: action_log_slots
  - action: utter_greet_personalized

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: user_goodbye
  - action: action_set_name_slots
  - action: action_log_slots
  - action: utter_goodbye

- rule: Tell time when asked
  steps:
  - intent: user_ask_time
  - action: action_set_name_slots
  - action: action_log_slots
  - action: action_set_time_of_day
  - action: utter_tell_time

- rule: Tell user what i'm thinking about
  steps:
  - intent: user_ask_thinking_about
  - action: action_set_name_slots
  - action: action_log_slots
  - action: utter_thinking_about

- rule: Tell the server name when asked
  steps:
  - intent: user_ask_name
  - action: action_set_name_slots
  - action: action_log_slots
  - action: utter_tell_name

- rule: Route name input through decision logic
  steps:
  - or:
    - intent: provide_full_name
    - intent: provide_first_name
  - action: action_set_name_slots
  - action: action_log_slots
  - action: action_handle_name_input

# After form completes - confirm the full name
- rule: Confirm full name after form completion
  condition:
  - active_loop: name_collection_form
  steps:
  - action: name_collection_form
  - active_loop: null
  - action: action_confirm_full_name
  - action: utter_ask_confirm_full_name

# Handle user's response to full name confirmation
- rule: Handle name confirmation - affirm or deny
  condition:
  - slot_was_set:
    - spelling_stage: confirming_both
  steps:
  - or:
    - intent: affirm
    - intent: deny
  - action: action_handle_spelling_confirmation

# Handle user's response to spelling confirmation
- rule: Handle spelling confirmation - affirm or deny
  condition:
  - slot_was_set:
    - spelling_stage: confirming_spelling
  steps:
  - or:
    - intent: affirm
    - intent: deny
  - action: action_handle_spelling_confirmation

# Process firstname spelling
- rule: Process firstname spelling
  condition:
  - slot_was_set:
    - spelling_stage: spelling_first
  steps:
  - intent: spell_name
  - action: action_process_spelling

# Process surname spelling
- rule: Process surname spelling
  condition:
  - slot_was_set:
    - spelling_stage: spelling_last
  steps:
  - intent: spell_name
  - action: action_process_spelling

# Handle confirmation of firstname spelling
- rule: Confirm firstname spelling - affirm or deny
  condition:
  - slot_was_set:
    - spelling_stage: confirming_first
  steps:
  - or:
    - intent: affirm
    - intent: deny
  - action: action_handle_spelling_confirmation

# Handle confirmation of surname spelling
- rule: Confirm surname spelling - affirm or deny
  condition:
  - slot_was_set:
    - spelling_stage: confirming_last
  steps:
  - or:
    - intent: affirm
    - intent: deny
  - action: action_handle_spelling_confirmation

# After spelling is complete, query the userbase
#- rule: Query userbase after name collection completes
#  condition:
#  - slot_was_set:
#    - spelling_stage: complete
#  - slot_was_set:
#    - name_complete: true
#  steps:
#  - action: action_query_userbase
#  - action: action_handle_enrollment_routing

# Handle user's response to recite prompt - affirm
- rule: User affirms recite prompt
  steps:
  #- action: utter_ask_recite_prompt
  - action: action_handle_enrollment_routing
  - intent: affirm
  - action: utter_read_prompt
  - action: action_start_enrollment_recording

# Handle user's response to recite prompt - deny
- rule: User denies recite prompt
  steps:
  #- action: utter_ask_recite_prompt
  - action: action_handle_enrollment_routing
  - intent: deny
  - action: utter_very_well
  - action: action_reset_enrollment
  #- TODO action: action_mute_enrollment

- rule: Trigger enrollment and ask if familiar
  steps:
  - intent: trigger_enrollment
  - action: action_trigger_enrollment
  - action: utter_ask_familar

- rule: After enrollment trigger - user affirms or denies familiarity
  condition:
  - slot_was_set:
    - enrollment_active: true
  steps:
  - action: utter_ask_familar
  - or:
    - intent: affirm
    - intent: deny
  - action: utter_ask_full_name

#- rule: After enrollment trigger - user provides name immediately
#  condition:
#  - slot_was_set:
#    - enrollment_active: true
#  steps:
#  - or:
#    - intent: provide_full_name
#    - intent: provide_first_name
#  - action: action_set_name_slots
#  - action: action_handle_name_input

- rule: Reset enrollment flags on success and transition to voice cloning
  steps:
    - intent: system_enrollment_complete_success
    - action: action_reset_enrollment
    - action: utter_ask_experiment_voice_cloning

- rule: Reset enrollment flags on abort
  steps:
    - intent: system_enrollment_complete_aborted
    - action: action_reset_enrollment

# User triggers voice cloning directly
- rule: User requests voice cloning
  steps:
    - intent: request_voice_cloning
    #- action: action_reset_voice_cloning
    - action: action_start_voice_cloning
    - action: utter_ask_whose_voice

# Handle voice cloning affirmative response
- rule: User affirms voice cloning
  steps:
    - action: utter_ask_experiment_voice_cloning
    - intent: affirm
    - action: action_start_voice_cloning
    - action: utter_ask_whose_voice

# Handle voice cloning denial
- rule: User denies voice cloning
  steps:
    - action: utter_ask_experiment_voice_cloning
    - intent: deny
    - action: action_reset_voice_cloning

# Capture ANY text as speaker name after prompt
# attempt 3: intent-agnostic
#- rule: Capture speaker name after prompt
#  condition:
#    - slot_was_set:
#        - voiceclone_active: true
#  steps:
#    - action: utter_ask_whose_voice
#    - action: action_listen
#    # Next user utterance captured regardless of intent
#    - action: action_set_voiceclone_lazyname
#    - action: action_query_userbase
#    - action: action_handle_speaker_match

# Capture ANY text as speaker name during speaker collection phase
# attempt 4: stronger stage machine adherance
- rule: Capture speaker name during vcspeakercollect
  condition:
    - slot_was_set:
        - vcspeakercollect_active: true
  steps:
    - action: action_set_voiceclone_lazyname
    - action: action_query_userbase
    - action: action_handle_speaker_match

# Double check username in voice clone flow
# attempt 2: intent-reliant
#- rule: Query speaker after name provided
#  condition:
#    - slot_was_set:
#        - voiceclone_active: true
#  steps:
#    - or:
#      - intent: provide_first_name
#      - intent: provide_full_name
#    - action: action_set_voiceclone_lazyname
#    - action: action_query_userbase

# Query speaker after name provided in voice clone flow
# attempt 1: capture everything
#- rule: Query speaker after name provided
#  condition:
#    - slot_was_set:
#        - voiceclone_active: true
#  steps:
#    - action: action_query_userbase

# User confirms speaker match (70-94% confidence)
- rule: User confirms speaker match
  condition:
    - slot_was_set:
        - vcspeakercollect_active: true
        - voiceclone_candidate
  steps:
    - intent: affirm
    - action: action_confirm_speaker_match    

# User rejects speaker match
- rule: User rejects speaker match
  condition:
    - slot_was_set:
        - vcspeakercollect_active: true
        - voiceclone_candidate
  steps:
    - intent: deny
    - action: action_reject_speaker_match

# Step 1: After voiceclone verified, fetch unique sources
- rule: Fetch passage sources after speaker verified
  condition:
    - slot_was_set:
        - voiceclone_active: true
        - passagecollect_active: true
  steps:
   # - action: utter_voiceclone_proceed
    - action: action_query_passages  # Action: unique_sources
    - action: utter_ask_passage_source

# Capture ANY text as passage source after prompt
- rule: Capture passage source after prompt
  condition:
    - slot_was_set:
        - voiceclone_active: true
        - passagecollect_active: true
  steps:
    - action: utter_ask_passage_source
    - action: action_listen
    # Next user utterance captured regardless of intent
    - action: action_set_psource_lazystring
    - action: action_query_passages  # Action: match_source
    - action: action_handle_passage_match

# Step 2: Query for match after user provides source name
#- rule: Query passage source after name provided
#  condition:
#    - slot_was_set:
#        - voiceclone_active: true
#        - passagecollect_active: true
#        - available_passage_sources
#  steps:
#    - intent: select_passage_source
#    - action: action_query_passages  # Action: match_source
#    - action: action_handle_passage_match

# Step 3a: User confirms passage source match (70-94% confidence)
- rule: User confirms passage source match
  condition:
    - slot_was_set:
        - voiceclone_active: true
        - passagecollect_active: true
        - psource_candidate
  steps:
    - action: utter_confirm_passage_source
    - intent: affirm
    - action: action_confirm_passage_match

# Step 3b: User rejects passage source match
- rule: User rejects passage source match
  condition:
    - slot_was_set:
        - voiceclone_active: true
        - passagecollect_active: true
        - psource_candidate
  steps:
    - action: utter_confirm_passage_source
    - intent: deny
    - action: action_reject_passage_match

#- rule: Respond to out-of-scope messages with action_do_nothing
#  steps:
#  - intent: nlu_fallback
#  - action: action_set_name_slots
#  - action: action_log_slots
#  #- action: utter_default
#  - action: action_do_nothing

- rule: Respond to out-of-scope messages with action_do_nothing
  condition:
    - slot_was_set:
        - voiceclone_active: false
    - slot_was_set:
        - passagecollect_active: false
    - slot_was_set:
        - enrollment_active: false
  steps:
  - intent: nlu_fallback
  - action: action_set_name_slots
  - action: action_log_slots
  - action: action_do_nothing